kind = "web"
previewPath = "/"
title = "Airline Management System"
version = "1.0.0"
id = "artifacts/airline-management"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18598

[services.development]
run = "pnpm --filter @workspace/airline-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airline-management", "run", "build" ]
serve = "static"
publicDir = "artifacts/airline-management/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18598"
BASE_PATH = "/"
